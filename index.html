<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Photo Gallery</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
    }

    /* Khung hiển thị ảnh lớn & caption */
    #image {
      line-height: 450px; /* Căn giữa dòng chữ theo chiều dọc */
      height: 450px;
      width: 700px;
      margin: 0 auto 30px auto;
      border: 4px solid #333;
      background-color: #7e57c2;
      background-image: url('');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
    }

    /* Hàng chứa các ảnh thu nhỏ bên dưới */
    .gallery {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .preview {
      width: 180px;
      height: 120px;
      object-fit: cover;
      border: 3px solid #444;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .preview:hover {
      border-color: #ff9800;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Khung hiển thị lớn -->
  <div id="image">
    Hover over an image below to display here.
  </div>

  <!-- Danh sách ảnh nhỏ -->
  <div class="gallery">
    <img class="preview" 
         alt="Thung lũng sông và núi rừng hoàng hôn" 
         src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800" 
         onmouseover="upDate(this)" 
         onmouseout="unDo()">

    <img class="preview" 
         alt="Dãy núi tuyết hùng vĩ và mây trắng" 
         src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800" 
         onmouseover="upDate(this)" 
         onmouseout="unDo()">

    <img class="preview" 
         alt="Cực quang xanh huyền ảo trên nền trời đêm" 
         src="https://images.unsplash.com/photo-1517411032315-54ef2cb783bb?w=800" 
         onmouseover="upDate(this)" 
         onmouseout="unDo()">
  </div>

  <!-- JavaScript xử lý sự kiện đúng chuẩn đề bài Coursera -->
  <script>
    function upDate(previewPic) {
      console.log("Mouse over triggered");
      console.log("Alt:", previewPic.alt);
      console.log("Source:", previewPic.src);

      var imageDiv = document.getElementById("image");
      // Cập nhật dòng chữ theo thuộc tính alt của ảnh
      imageDiv.innerHTML = previewPic.alt;
      // Cập nhật ảnh nền của khung #image
      imageDiv.style.backgroundImage = "url('" + previewPic.src + "')";
    }

    function unDo() {
      var imageDiv = document.getElementById("image");
      // Trả background-image về rỗng
      imageDiv.style.backgroundImage = "url('')";
      // Đặt lại dòng chữ hướng dẫn ban đầu
      imageDiv.innerHTML = "Hover over an image below to display here.";
    }
  </script>
</body>
</html>
